plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lada.wheelbridge'
    compileSdk 28

    defaultConfig {
        applicationId "com.lada.wheelbridge"
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Зависимостей нет — используем только Android SDK
}
