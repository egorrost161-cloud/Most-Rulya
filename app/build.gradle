plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lada.wheelbridge'
    compileSdk 28

    defaultConfig {
        applicationId "com.lada.wheelbridge"
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName "1.0"

        // 32-битная ARM-архитектура (armeabi-v7a)
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Не сжимать ресурсы — нам нужны все строки
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.6.0'
}
